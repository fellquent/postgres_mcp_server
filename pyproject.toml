[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fellquent", email = "mstdnchk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
